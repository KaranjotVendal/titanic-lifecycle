[project]
name = "titanic"
version = "0.1.0"
description = "Kaggle Titanic — full ML lifecycle portfolio project"
readme = "README.md"
authors = [
    { name = "karanjotvendal", email = "karanjotgharu60@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "evidently>=0.7.23",
    "fastapi>=0.142.2",
    "jupyter>=1.1.1",
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
